<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baobab Search</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
  body[data-theme="dark"] { background:#1A1612; color:#F8F5F0; }
 .hidden{display:none}
 .strong-banner{background:#D93025;color:white;text-align:center;padding:8px;font-size:13px;font-weight:500;position:sticky;top:0;z-index:999}
 .page{display:none}.page.active{display:block}
 .search-bar{display:flex;gap:8px;align-items:center;max-width:700px;margin:20px auto;border:1px solid #ddd;border-radius:24px;padding:8px 16px}
 .search-bar.small{max-width:600px;margin:0}
 .icon-btn{background:none;border:none;cursor:pointer;padding:4px}
 .icon-btn.primary{background:#A0522D;border-radius:50%;padding:8px}
 .result-card{padding:12px 24px}
 .result-card.title{font-size:18px;color:#1A73E8;text-decoration:none}
 .ai-card{border:1px solid #dadce0;border-radius:12px;padding:16px;margin:16px 24px;background:#F8F9FA}
 .ai-header{font-size:14px;font-weight:600;color:#1A73E8;margin-bottom:8px}
  </style>
</head>
<body>
  <div id="strongBanner" class="strong-banner hidden">🔒 MODE RENFORCÉ ACTIF - Aucune donnée n'est enregistrée</div>

  <main id="home" class="page active">
    <header class="top-nav">
      <div class="logo" onclick="goHome()" style="cursor:pointer;font-weight:700">BS</div>
      <button data-i18n="settings" onclick="showPage('settings')">Paramètres</button>
    </header>
    <div class="home-center">
      <h1>Baobab <span>Search</span></h1>
      <div class="search-bar" id="searchBar">
        <input id="searchInput" type="text" data-i18n-placeholder="searchPlaceholder" placeholder="Recher sur Baobab..." onfocus="showSuggestions()" oninput="liveSuggest()">
        <div class="search-icons">
          <button class="icon-btn" onclick="startVoice()" title="Micro"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1A73E8"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zm5 8a5 5 0 0 1-10 0H5a7 7 0 0 0 14 0h-2z"/></svg></button>
          <button class="icon-btn" onclick="startImageSearch()" title="Image"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button>
          <button class="icon-btn primary" onclick="search()" title="Rechercher"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
        </div>
      </div>
      <div id="suggestions" class="suggestions hidden">
        <div class="section-title" data-i18n="recent">Historique récent</div>
        <div id="historyList"></div>
      </div>
    </div>
  </main>

  <main id="results" class="page">
    <header class="results-header">
      <div class="logo" onclick="goHome()" style="cursor:pointer;font-weight:700">BS</div>
      <div class="search-bar small">
        <input id="searchInput2" type="text" data-i18n-placeholder="searchPlaceholder" onkeydown="if(event.key==='Enter') search()">
        <button class="icon-btn primary" onclick="search()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
      </div>
    </header>

    <div id="aiBlock" class="ai-card hidden">
      <div class="ai-header">✨ Aperçu Baobab IA</div>
      <div id="aiText" class="ai-text">Recherche de la réponse...</div>
      <button id="aiBtn" class="ai-btn hidden" onclick="expandAI()">Afficher plus ▼</button>
      <div id="aiSources" class="ai-sources"></div>
    </div>

    <div id="resultsList" class="results"></div>
  </main>

  <main id="settings" class="page">
    <h2 data-i18n="settings">Paramètres</h2>
    <div class="setting-group">
      <h3 data-i18n="general">Général</h3>
      <label><span data-i18n="langSearch">Langue de recherche:</span>
        <select id="langSelect">
          <option value="fr-FR">Français</option><option value="en-US">English</option>
          <option value="es-ES">Español</option><option value="pt-PT">Português</option>
          <option value="it-IT">Italiano</option><option value="de-DE">Deutsche</option>
          <option value="ar-SA">العربية</option>
        </select>
      </label>
    </div>
    <div class="setting-group">
      <h3 data-i18n="security">Sécurité et Confidentialité</h3>
      <label><span data-i18n="protectionMode">Mode de protection:</span>
        <select id="securityMode" onchange="setSecurityMode(this.value)">
          <option value="standard">Standard</option><option value="strong">Renforcé</option>
        </select>
      </label>
      <p class="help-text" data-i18n="strongHelp">Mode Renforcé : Aucune donnée n'est enregistrée.</p>
      <h4 data-i18n="privacy">Vie privée & Historique</h4>
      <label><input type="checkbox" id="saveActivity" checked> <span data-i18n="saveActivity">Enregistrer l'activité</span></label>
      <button onclick="clearHistory()" data-i18n="clearHistory">Effacer l'historique récent</button>
    </div>
    <div class="setting-group">
      <h3 data-i18n="appearance">Apparence</h3>
      <label><span data-i18n="theme">Thème:</span>
        <select onchange="setTheme(this.value)">
          <option value="light">Clair</option><option value="dark">Sombre</option><option value="system">Système</option>
        </select>
      </label>
      <label><span data-i18n="fontSize">Taille du texte:</span>
        <select onchange="setFontSize(this.value)">
          <option value="14px">Petit</option><option value="16px" selected>Moyen</option><option value="18px">Grand</option>
        </select>
      </label>
    </div>
    <button class="back" onclick="goHome()" data-i18n="back">Retour</button>
  </main>

<script src="script.js"></script>
</body></html>
