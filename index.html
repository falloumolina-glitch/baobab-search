<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baobab Search</title>
  
  <!-- POUR L'INSTALLATION -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1A73E8">
  
  <!-- EMPECHER LE CACHE NAVIGATEUR -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://*.wikipedia.org https://commons.wikimedia.org; frame-src 'self' https://www.youtube.com https://news.google.com https://www.google.com;">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
  :root { --bg: #fff; --text: #202124; --border: #dfe1e5; --card: #F8F9FA; --muted: #5f6368; --link: #1A73E8; }
  [data-theme="dark"] { --bg: #202124; --text: #e8eaed; --border: #5f6368; --card: #303134; --muted: #9aa0a6; --link: #8ab4f8; }
  body{font-family:Inter;background:var(--bg);color:var(--text);margin:0;line-height:1.6;min-height:100vh}
  .page{display:none;background:var(--bg)}.page.active{display:block;min-height:100vh}
  .top-nav,.results-header{display:flex;align-items:center;padding:12px 24px;gap:16px;background:var(--bg)}
  .top-nav button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:6px 12px;font-size:14px;cursor:pointer;font-family:Inter}
  .logo{font-weight:700;font-size:22px;color:var(--link);cursor:pointer}
  .search-bar{display:flex;align-items:center;border:1px solid var(--border);border-radius:24px;padding:5px 8px;width:100%;max-width:600px;background:var(--bg)}
  .search-bar input{border:none;outline:none;flex:1;font-size:16px;padding:8px;background:transparent;color:var(--text)}
  .icon-btn{background:none;border:none;cursor:pointer;padding:8px;border-radius:50%}
  .icon-btn.primary{background:var(--link);border-radius:50%}
  .icon-btn.primary svg{stroke:#fff; fill:#fff}
  .strong-banner{background:#D93025;color:white;text-align:center;padding:8px;font-size:13px;font-weight:500;position:sticky;top:0;z-index:999}
  .strong-banner.hidden{display:none}
  </style>
</head>
<body>
  <div id="strongBanner" class="strong-banner hidden">🔒 MODE RENFORCÉ ACTIF - Aucune donnée n'est enregistrée</div>

  <main id="home" class="page active">
    <header class="top-nav"><div class="logo" onclick="goHome()">BS</div></header>
    <div style="text-align:center;margin-top:80px">
      <h1 style="font-size:48px">Baobab <span style="color:var(--link)">Search</span></h1>
      <div style="position:relative; width:100%; max-width:600px; margin:20px auto">
        <div class="search-bar">
          <input id="searchInput" type="text" placeholder="Rechercher sur Baobab...">
          <button class="icon-btn primary" onclick="search()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
        </div>
      </div>
    </div>
  </main>

<script src="script.js"></script>
<script>
function goHome(){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('home').classList.add('active')}

// ENREGISTRER LE SERVICE WORKER
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js")
      .then((reg) => console.log("Baobab Search installée :", reg.scope))
      .catch((err) => console.log("Erreur SW:", err));
  });
}
</script>
</body></html>
